[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/home-two"
  to = "/"
  status = 301

[[redirects]]
  from = "/home_two"
  to = "/"
  status = 301

[[redirects]]
  from = "/home-2"
  to = "/"
  status = 301

# Renders, logo and brochure keep stable filenames, so cache for a day
# and let the CDN revalidate after that.
[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
